# This workflow will do a clean install of dependencies, build the source code and run tests
# For more information see: https://help.github.actions/language-and-framework-guides

name: Linting, Testing and Release

on:
  push:
    branches: [master, next, beta]
  pull_request:
    branches: [master, next, beta]

env:
  CI: true

jobs:
  lint_test_build_release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use Bun.sh
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Use Node.js 26 (test runtime + uWS binaries)
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26

      - name: Cache
        uses: actions/cache@v6.1.0
        with:
          path: '~/.bun/install/cache'
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint code
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test code
        run: bun run test

      - name: Release
        env:
          GIT_USERNAME: ${{ vars.GIT_USERNAME }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release-me --plugins=npm,npm-post,git,github-release
